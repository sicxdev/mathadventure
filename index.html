<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Adventure: Help</title>
<link rel="icon" href="icon.png">
<style>
:root{--ink:#2B1B4D;--soft:#6B5A8E;--grape:#7C5CFF;--bg:#F6F1FF;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header img{width:64px;height:64px;border-radius:15px}
header b{font-size:20px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
nav button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:#fff;border:2px solid #D9CCF5;border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:#fff}
nav button:focus-visible,a:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
h1{font-size:32px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
h2{font-size:20px;margin:28px 0 6px}
p{margin:0 0 10px}
.lead{font-size:19px}
.foot{margin-top:36px;padding-top:16px;border-top:2px solid #E3D9F7;color:var(--soft);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 18px}
a{color:#5A3FD6}
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><b>Math Adventure</b></header>
<nav id="langs" aria-label="Language"></nav>
<article id="doc"></article>
</main>
<script>
/* Vul hier je eigen gegevens in. Ze verschijnen in alle vijf talen. */
var CONTACT = { name: "JOUW NAAM", email: "JOUW-E-MAILADRES" };
var KIND = "support";
var NAMES = {"nl": "Nederlands", "en": "English", "fr": "Français", "de": "Deutsch", "es": "Español"};
var TEXT = {"nl": {"t": "Hulp en contact", "lead": "Math Adventure is een rekenspel voor kinderen van 5 tot 12 jaar. Hieronder staan de meest gestelde vragen.", "s": [["Hoe verander ik de taal?", "Tik op het welkomstscherm op de wereldbol, of open Meer in de app. Je kunt kiezen uit Nederlands, Engels, Frans, Duits en Spaans."], ["Kunnen meerdere kinderen spelen?", "Ja. Tik linksboven op de naam van de speler en kies Nieuw. Elk kind heeft een eigen voortgang en een eigen rekenniveau."], ["Hoe bepaalt de app de moeilijkheid?", "De app houdt per bewerking een niveau van 1 tot 10 bij. Gaat het goed, dan worden de sommen stap voor stap moeilijker. Gaat het even minder, dan komen er makkelijkere sommen en extra plaatjes."], ["Waar staat de voortgang?", "Alleen op het apparaat zelf. Er is geen account en er wordt niets verstuurd. Verwijder je de app, dan is de voortgang weg."], ["Hoe open ik het ouderoverzicht?", "Open Meer en kies Voor ouders. Na een korte rekensom zie je per bewerking het niveau, het percentage goed en de sommen die lastig waren."], ["Hoe pas ik het plaatje of de leeftijd aan?", "Open Meer en tik op Aanpassen. Kies een ander plaatje of een andere leeftijd. Sterren, munten en levels blijven bewaard."], ["Contact", "Staat je vraag er niet bij? Mail naar {email}."]], "priv": "Privacyverklaring"}, "en": {"t": "Help and contact", "lead": "Math Adventure is a math game for children aged 5 to 12. The most common questions are answered below.", "s": [["How do I change the language?", "Tap the globe on the welcome screen, or open More in the app. You can choose Dutch, English, French, German or Spanish."], ["Can several children play?", "Yes. Tap the player name at the top left and choose New. Each child has their own progress and their own skill levels."], ["How does the app set the difficulty?", "The app keeps a level from 1 to 10 for each operation. When things go well, problems get harder step by step. When they get tricky, easier problems and extra pictures follow."], ["Where is the progress stored?", "Only on the device itself. There is no account and nothing is sent anywhere. Deleting the app removes the progress."], ["How do I open the parent overview?", "Open More and choose For parents. After a short calculation you see the level, the share of correct answers and the tricky problems for each operation."], ["How do I change the picture or the age?", "Open More and tap Edit. Choose another picture or another age. Stars, coins and levels are kept."], ["Contact", "Is your question not listed? Email {email}."]], "priv": "Privacy Policy"}, "fr": {"t": "Aide et contact", "lead": "Math Adventure est un jeu de calcul pour les enfants de 5 à 12 ans. Voici les questions les plus fréquentes.", "s": [["Comment changer la langue ?", "Touchez le globe sur l'écran d'accueil, ou ouvrez Plus dans l'application. Vous avez le choix entre néerlandais, anglais, français, allemand et espagnol."], ["Plusieurs enfants peuvent-ils jouer ?", "Oui. Touchez le nom du joueur en haut à gauche et choisissez Nouveau. Chaque enfant a sa propre progression et son propre niveau."], ["Comment l'application règle-t-elle la difficulté ?", "L'application suit un niveau de 1 à 10 pour chaque opération. Quand tout va bien, les calculs deviennent plus difficiles pas à pas. Quand c'est plus dur, des calculs plus simples et des images supplémentaires arrivent."], ["Où la progression est-elle enregistrée ?", "Uniquement sur l'appareil. Il n'y a pas de compte et rien n'est envoyé. Supprimer l'application efface la progression."], ["Comment ouvrir l'espace parents ?", "Ouvrez Plus et choisissez Pour les parents. Après un court calcul, vous voyez pour chaque opération le niveau, le taux de réussite et les calculs difficiles."], ["Comment changer l'image ou l'âge ?", "Ouvrez Plus et touchez Modifier. Choisissez une autre image ou un autre âge. Les étoiles, les pièces et les niveaux sont conservés."], ["Contact", "Votre question n'y figure pas ? Écrivez à {email}."]], "priv": "Politique de confidentialité"}, "de": {"t": "Hilfe und Kontakt", "lead": "Math Adventure ist ein Rechenspiel für Kinder von 5 bis 12 Jahren. Hier stehen die häufigsten Fragen.", "s": [["Wie ändere ich die Sprache?", "Tippen Sie auf dem Startbildschirm auf die Weltkugel oder öffnen Sie in der App Mehr. Zur Wahl stehen Niederländisch, Englisch, Französisch, Deutsch und Spanisch."], ["Können mehrere Kinder spielen?", "Ja. Tippen Sie oben links auf den Namen des Spielers und wählen Sie Neu. Jedes Kind hat seinen eigenen Fortschritt und seine eigenen Rechenstufen."], ["Wie legt die App die Schwierigkeit fest?", "Die App führt für jede Rechenart eine Stufe von 1 bis 10. Läuft es gut, werden die Aufgaben Schritt für Schritt schwieriger. Wird es knifflig, folgen leichtere Aufgaben und zusätzliche Bilder."], ["Wo wird der Fortschritt gespeichert?", "Nur auf dem Gerät selbst. Es gibt kein Konto und es wird nichts gesendet. Wenn Sie die App löschen, ist der Fortschritt weg."], ["Wie öffne ich die Elternübersicht?", "Öffnen Sie Mehr und wählen Sie Für Eltern. Nach einer kurzen Rechenaufgabe sehen Sie je Rechenart die Stufe, den Anteil richtiger Antworten und die schwierigen Aufgaben."], ["Wie ändere ich das Bild oder das Alter?", "Öffnen Sie Mehr und tippen Sie auf Ändern. Wählen Sie ein anderes Bild oder ein anderes Alter. Sterne, Münzen und Level bleiben erhalten."], ["Kontakt", "Ihre Frage ist nicht dabei? Schreiben Sie an {email}."]], "priv": "Datenschutzerklärung"}, "es": {"t": "Ayuda y contacto", "lead": "Math Adventure es un juego de cálculo para niños de 5 a 12 años. Aquí están las preguntas más frecuentes.", "s": [["¿Cómo cambio el idioma?", "Toca el globo en la pantalla de bienvenida o abre Más en la aplicación. Puedes elegir neerlandés, inglés, francés, alemán o español."], ["¿Pueden jugar varios niños?", "Sí. Toca el nombre del jugador arriba a la izquierda y elige Nuevo. Cada niño tiene su propio progreso y su propio nivel."], ["¿Cómo ajusta la aplicación la dificultad?", "La aplicación lleva un nivel del 1 al 10 para cada operación. Cuando va bien, las cuentas se vuelven más difíciles paso a paso. Cuando cuesta más, llegan cuentas más fáciles y más dibujos."], ["¿Dónde se guarda el progreso?", "Solo en el propio dispositivo. No hay cuenta y no se envía nada. Al eliminar la aplicación se pierde el progreso."], ["¿Cómo abro el resumen para padres?", "Abre Más y elige Para padres. Tras una operación corta verás, para cada operación, el nivel, el porcentaje de aciertos y las cuentas difíciles."], ["¿Cómo cambio el dibujo o la edad?", "Abre Más y toca Editar. Elige otro dibujo u otra edad. Las estrellas, las monedas y los niveles se mantienen."], ["Contacto", "¿No encuentras tu pregunta? Escribe a {email}."]], "priv": "Política de privacidad"}};
var LINKS = {"nl": {"priv": "Privacyverklaring", "sup": "Hulp en contact"}, "en": {"priv": "Privacy Policy", "sup": "Help and contact"}, "fr": {"priv": "Politique de confidentialité", "sup": "Aide et contact"}, "de": {"priv": "Datenschutzerklärung", "sup": "Hilfe und Kontakt"}, "es": {"priv": "Política de privacidad", "sup": "Ayuda y contacto"}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fill(s){var mail=esc(CONTACT.email);return esc(s).replace("{email}",CONTACT.email.indexOf("@")>0?'<a href="mailto:'+mail+'">'+mail+'</a>':mail).replace("{name}",esc(CONTACT.name))}
function show(l){
  if(!TEXT[l])l="en";var t=TEXT[l];document.documentElement.lang=l;
  var h='<h1>'+esc(t.t)+'</h1><p class="lead">'+esc(t.lead)+'</p>';
  t.s.forEach(function(x){h+='<h2>'+esc(x[0])+'</h2><p>'+fill(x[1])+'</p>'});
  h+='<div class="foot">'+(t.upd?'<span>'+esc(t.upd)+'</span>':'')+(KIND==="privacy"?'<a href="index.html#'+l+'">'+esc(LINKS[l].sup)+'</a>':'<a href="privacy.html#'+l+'">'+esc(LINKS[l].priv)+'</a>')+'</div>';
  document.getElementById("doc").innerHTML=h;
  document.getElementById("langs").innerHTML=Object.keys(NAMES).map(function(k){return '<button type="button" lang="'+k+'" data-l="'+k+'" aria-pressed="'+(k===l)+'">'+NAMES[k]+'</button>'}).join("");
  document.title="Math Adventure: "+t.t;
}
function pick(){var h=location.hash.slice(1);if(TEXT[h])return h;var n=(navigator.language||"en").slice(0,2).toLowerCase();return TEXT[n]?n:"en"}
document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){history.replaceState(null,"","#"+b.dataset.l);show(b.dataset.l)}});
window.addEventListener("hashchange",function(){show(pick())});
show(pick());
</script>
</body>
</html>
