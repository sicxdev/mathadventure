<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Adventure: Privacy</title>
<link rel="icon" href="icon.png">
<style>
:root{--ink:#2B1B4D;--soft:#6B5A8E;--grape:#7C5CFF;--bg:#F6F1FF;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header img{width:64px;height:64px;border-radius:15px}
header b{font-size:20px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
nav button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:#fff;border:2px solid #D9CCF5;border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:#fff}
nav button:focus-visible,a:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
h1{font-size:32px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
h2{font-size:20px;margin:28px 0 6px}
p{margin:0 0 10px}
.lead{font-size:19px}
.foot{margin-top:36px;padding-top:16px;border-top:2px solid #E3D9F7;color:var(--soft);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 18px}
a{color:#5A3FD6}
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><b>Math Adventure</b></header>
<nav id="langs" aria-label="Language"></nav>
<article id="doc"></article>
</main>
<script>
/* Vul hier je eigen gegevens in. Ze verschijnen in alle vijf talen. */
var CONTACT = { name: "JOUW NAAM", email: "JOUW-E-MAILADRES" };
var KIND = "privacy";
var NAMES = {"nl": "Nederlands", "en": "English", "fr": "Français", "de": "Deutsch", "es": "Español"};
var TEXT = {"nl": {"t": "Privacyverklaring", "lead": "Math Adventure verzamelt geen gegevens. Alles wat de app onthoudt, blijft op je eigen apparaat.", "s": [["Wat de app niet doet", "Er is geen account, geen reclame, geen analyse van gebruik en geen meetsoftware van andere bedrijven. De app stuurt niets naar ons of naar anderen en werkt zonder internet."], ["Wat op het apparaat wordt bewaard", "Per speler: de ingevulde naam of bijnaam, het gekozen plaatje, de leeftijd, de voortgang in het spel, het rekenniveau en de instellingen. Deze gegevens verlaten het apparaat niet."], ["Kinderen", "De app is gemaakt voor kinderen. We verzamelen geen persoonsgegevens van kinderen of ouders. Het ouderoverzicht zit achter een rekensom die bedoeld is voor volwassenen."], ["Gegevens verwijderen", "Open in de app Meer, kies Voor ouders en verwijder het profiel of wis de voortgang. Als je de app verwijdert, verdwijnen alle gegevens."], ["Reservekopieën", "Maak je een reservekopie van je apparaat via iCloud of je computer, dan kunnen de gegevens van de app daarin zitten. Die kopie valt onder je eigen Apple-account."], ["Contact", "Vragen over privacy? Mail naar {email}. Verantwoordelijk voor deze app: {name}."]], "upd": "Laatst bijgewerkt: 13 november 2026"}, "en": {"t": "Privacy Policy", "lead": "Math Adventure collects no data. Everything the app remembers stays on your own device.", "s": [["What the app does not do", "There is no account, no advertising, no usage analytics and no tracking software from other companies. The app sends nothing to us or to anyone else and works without an internet connection."], ["What is stored on the device", "For each player: the name or nickname entered, the chosen picture, the age, game progress, skill levels and settings. This information never leaves the device."], ["Children", "The app is made for children. We do not collect personal data from children or parents. The parent overview sits behind a calculation intended for adults."], ["Deleting data", "In the app, open More, choose For parents and delete the profile or reset the progress. Deleting the app removes all data."], ["Backups", "If you back up your device through iCloud or your computer, the app data may be included. That backup belongs to your own Apple account."], ["Contact", "Questions about privacy? Email {email}. Responsible for this app: {name}."]], "upd": "Last updated: 13 November 2026"}, "fr": {"t": "Politique de confidentialité", "lead": "Math Adventure ne collecte aucune donnée. Tout ce que l'application retient reste sur votre appareil.", "s": [["Ce que l'application ne fait pas", "Il n'y a ni compte, ni publicité, ni analyse d'utilisation, ni logiciel de suivi d'autres entreprises. L'application n'envoie rien, ni à nous ni à des tiers, et fonctionne sans connexion Internet."], ["Ce qui est enregistré sur l'appareil", "Pour chaque joueur : le prénom ou surnom saisi, l'image choisie, l'âge, la progression dans le jeu, le niveau en calcul et les réglages. Ces informations ne quittent jamais l'appareil."], ["Enfants", "L'application est conçue pour les enfants. Nous ne collectons aucune donnée personnelle, ni des enfants ni des parents. L'espace parents est protégé par un calcul destiné aux adultes."], ["Supprimer les données", "Dans l'application, ouvrez Plus, choisissez Pour les parents, puis supprimez le profil ou effacez la progression. Supprimer l'application efface toutes les données."], ["Sauvegardes", "Si vous sauvegardez votre appareil via iCloud ou votre ordinateur, les données de l'application peuvent en faire partie. Cette sauvegarde relève de votre propre compte Apple."], ["Contact", "Des questions sur la confidentialité ? Écrivez à {email}. Responsable de cette application : {name}."]], "upd": "Dernière mise à jour : 13 novembre 2026"}, "de": {"t": "Datenschutzerklärung", "lead": "Math Adventure erhebt keine Daten. Alles, was sich die App merkt, bleibt auf Ihrem eigenen Gerät.", "s": [["Was die App nicht tut", "Es gibt kein Konto, keine Werbung, keine Nutzungsanalyse und keine Tracking-Software anderer Unternehmen. Die App sendet nichts an uns oder an Dritte und funktioniert ohne Internetverbindung."], ["Was auf dem Gerät gespeichert wird", "Pro Spieler: der eingegebene Name oder Spitzname, das gewählte Bild, das Alter, der Spielfortschritt, die Rechenstufen und die Einstellungen. Diese Angaben verlassen das Gerät nicht."], ["Kinder", "Die App ist für Kinder gemacht. Wir erheben keine personenbezogenen Daten von Kindern oder Eltern. Die Elternübersicht ist durch eine Rechenaufgabe für Erwachsene geschützt."], ["Daten löschen", "Öffnen Sie in der App Mehr, wählen Sie Für Eltern und löschen Sie das Profil oder den Fortschritt. Wenn Sie die App löschen, werden alle Daten entfernt."], ["Backups", "Wenn Sie Ihr Gerät über iCloud oder Ihren Computer sichern, können die Daten der App darin enthalten sein. Dieses Backup gehört zu Ihrem eigenen Apple-Konto."], ["Kontakt", "Fragen zum Datenschutz? Schreiben Sie an {email}. Verantwortlich für diese App: {name}."]], "upd": "Zuletzt aktualisiert: 13. November 2026"}, "es": {"t": "Política de privacidad", "lead": "Math Adventure no recopila ningún dato. Todo lo que la aplicación recuerda se queda en tu propio dispositivo.", "s": [["Lo que la aplicación no hace", "No hay cuenta, ni publicidad, ni análisis de uso, ni software de seguimiento de otras empresas. La aplicación no envía nada, ni a nosotros ni a terceros, y funciona sin conexión a Internet."], ["Lo que se guarda en el dispositivo", "Por cada jugador: el nombre o apodo introducido, el dibujo elegido, la edad, el progreso en el juego, el nivel de cálculo y los ajustes. Esta información nunca sale del dispositivo."], ["Niños", "La aplicación está hecha para niños. No recopilamos datos personales de niños ni de padres. El resumen para padres está protegido por una operación pensada para adultos."], ["Eliminar datos", "En la aplicación, abre Más, elige Para padres y elimina el perfil o borra el progreso. Al eliminar la aplicación se borran todos los datos."], ["Copias de seguridad", "Si haces una copia de seguridad del dispositivo con iCloud o con tu ordenador, los datos de la aplicación pueden estar incluidos. Esa copia pertenece a tu propia cuenta de Apple."], ["Contacto", "¿Preguntas sobre privacidad? Escribe a {email}. Responsable de esta aplicación: {name}."]], "upd": "Última actualización: 13 de noviembre de 2026"}};
var LINKS = {"nl": {"priv": "Privacyverklaring", "sup": "Hulp en contact"}, "en": {"priv": "Privacy Policy", "sup": "Help and contact"}, "fr": {"priv": "Politique de confidentialité", "sup": "Aide et contact"}, "de": {"priv": "Datenschutzerklärung", "sup": "Hilfe und Kontakt"}, "es": {"priv": "Política de privacidad", "sup": "Ayuda y contacto"}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fill(s){var mail=esc(CONTACT.email);return esc(s).replace("{email}",CONTACT.email.indexOf("@")>0?'<a href="mailto:'+mail+'">'+mail+'</a>':mail).replace("{name}",esc(CONTACT.name))}
function show(l){
  if(!TEXT[l])l="en";var t=TEXT[l];document.documentElement.lang=l;
  var h='<h1>'+esc(t.t)+'</h1><p class="lead">'+esc(t.lead)+'</p>';
  t.s.forEach(function(x){h+='<h2>'+esc(x[0])+'</h2><p>'+fill(x[1])+'</p>'});
  h+='<div class="foot">'+(t.upd?'<span>'+esc(t.upd)+'</span>':'')+(KIND==="privacy"?'<a href="index.html#'+l+'">'+esc(LINKS[l].sup)+'</a>':'<a href="privacy.html#'+l+'">'+esc(LINKS[l].priv)+'</a>')+'</div>';
  document.getElementById("doc").innerHTML=h;
  document.getElementById("langs").innerHTML=Object.keys(NAMES).map(function(k){return '<button type="button" lang="'+k+'" data-l="'+k+'" aria-pressed="'+(k===l)+'">'+NAMES[k]+'</button>'}).join("");
  document.title="Math Adventure: "+t.t;
}
function pick(){var h=location.hash.slice(1);if(TEXT[h])return h;var n=(navigator.language||"en").slice(0,2).toLowerCase();return TEXT[n]?n:"en"}
document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){history.replaceState(null,"","#"+b.dataset.l);show(b.dataset.l)}});
window.addEventListener("hashchange",function(){show(pick())});
show(pick());
</script>
</body>
</html>
